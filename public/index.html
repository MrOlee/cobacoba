<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0e1117" />
<meta name="referrer" content="no-referrer" />
<title>RAYLIZIIEDESU — Portal Anime & Drama Subtitle Indonesia</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: #0e1117; color: #e2e8f0; min-height: 100vh; padding-bottom: 50px; }
  a { color: inherit; text-decoration: none; }
  button { cursor: pointer; border: none; font-family: inherit; }

  header { background: #000000; padding: 20px 15px; text-align: center; border-bottom: 3px solid #00a8e8; }
  .logo { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; text-transform: uppercase; }
  .logo .white { color: #ffffff; }
  .logo .blue { color: #00a8e8; }
  .sub-logo { font-size: 12px; color: #00a8e8; margin-top: 4px; font-weight: 600; }

  .main-tabs { display: flex; background: #161b22; max-width: 960px; margin: 0 auto; border-bottom: 2px solid #21262d; }
  .main-tab-btn { flex: 1; padding: 14px 10px; text-align: center; background: #161b22; color: #8b949e; font-weight: 800; font-size: 15px; text-transform: uppercase; border: none; transition: 0.2s; }
  .main-tab-btn.active { background: #00a8e8; color: #ffffff; }

  .sub-nav-container { background: #161b22; border-bottom: 1px solid #30363d; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
  .sub-nav-container::-webkit-scrollbar { display: none; }
  .sub-nav { display: inline-flex; max-width: 960px; width: 100%; padding: 6px 10px; gap: 4px; }
  .sub-btn { background: #21262d; color: #c9d1d9; padding: 8px 14px; font-size: 12px; font-weight: 700; border-radius: 4px; white-space: nowrap; transition: 0.2s; }
  .sub-btn:hover, .sub-btn.active { background: #00a8e8; color: #fff; }

  .search-section { max-width: 960px; margin: 15px auto 10px; padding: 0 15px; text-align: center; }
  .search-box-wrap { position: relative; max-width: 550px; margin: 0 auto; }
  .search-input { width: 100%; padding: 12px 18px; background: #ffffff; color: #000000; border: 2px solid #00a8e8; border-radius: 25px; font-size: 14px; outline: none; font-weight: 600; text-align: center; }

  .container { max-width: 960px; margin: 0 auto; padding: 12px; }

  .section-title { font-size: 16px; font-weight: 800; color: #00a8e8; margin: 15px 0 12px; display: flex; align-items: center; gap: 8px; border-left: 4px solid #00a8e8; padding-left: 10px; text-transform: uppercase; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 550px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 800px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 15px; } }

  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s; display: flex; flex-direction: column; }
  .card:hover { transform: translateY(-4px); border-color: #00a8e8; }
  
  .poster-box { width: 100%; aspect-ratio: 3/4; background: #21262d; position: relative; overflow: hidden; }
  .poster-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .card-title { padding: 10px 12px; font-size: 13px; font-weight: 700; line-height: 1.35; color: #f0f6fc; height: 48px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  .pills-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .pill-btn { background: #21262d; color: #58a6ff; border: 1px solid #30363d; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; }
  .pill-btn:hover { background: #00a8e8; color: #fff; }

  .player-view { display: none; }
  .player-view.active { display: block; }

  .btn-back { background: #21262d; color: #fff; padding: 9px 16px; border-radius: 6px; font-size: 13px; font-weight: 700; margin-bottom: 15px; border: 1px solid #30363d; }
  .btn-back:hover { background: #00a8e8; }

  .title-anime { font-size: 20px; font-weight: 800; color: #00a8e8; margin-bottom: 12px; }

  .player-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
  .player-box iframe { width: 100%; height: 100%; border: none; }
  .loading-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #0d1117; color: #00a8e8; font-weight: 700; }

  .ep-select { width: 100%; padding: 11px; background: #161b22; border: 1px solid #00a8e8; color: #fff; border-radius: 6px; font-size: 13px; margin-bottom: 15px; }

  .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
  .ep-btn { background: #161b22; border: 1px solid #30363d; color: #fff; padding: 9px 4px; font-size: 12px; font-weight: 700; text-align: center; border-radius: 6px; }
  .ep-btn.active, .ep-btn:hover { background: #00a8e8; border-color: #00a8e8; }

  .status-msg { text-align: center; padding: 50px 20px; color: #8b949e; grid-column: 1 / -1; font-size: 14px; }
  .btn-retry { margin-top: 12px; background: #00a8e8; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; font-weight: 700; }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="white">RAYLIZIIE</span><span class="blue">DESU</span></div>
  <div class="sub-logo">Portal Anime (AnimeKompi) & Drama (Filmbox)</div>
</header>

<div class="main-tabs">
  <button class="main-tab-btn active" id="btnMainAnime" onclick="switchCategory('anime')">ANIME (ANIMEKOMPI)</button>
  <button class="main-tab-btn" id="btnMainDrama" onclick="switchCategory('drama')">DRAMA (FILMBOX)</button>
</div>

<div class="sub-nav-container">
  <div class="sub-nav" id="subNavAnime">
    <button class="sub-btn active" onclick="loadAnime('home', this)">🏠 Home</button>
    <button class="sub-btn" onclick="loadAnime('list', this)">📜 Anime List</button>
    <button class="sub-btn" onclick="loadAnime('schedule', this)">📅 Jadwal Rilis</button>
    <button class="sub-btn" onclick="loadAnime('genres', this)">🏷️ Genres</button>
  </div>
  <div class="sub-nav" id="subNavDrama" style="display:none;">
    <button class="sub-btn active" onclick="loadDrama('home', this)">🏠 Home</button>
    <button class="sub-btn" onclick="loadDrama('trending', this)">🔥 Trending Drama</button>
  </div>
</div>

<div class="search-section">
  <div class="search-box-wrap">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cari judul anime atau drama..." />
  </div>
</div>

<div class="container">

  <div id="catalogView">
    <div id="sectionTitle" class="section-title">🔥 ANIME TERBARU</div>
    <div id="subArea"></div>
    <div id="catalogGrid" class="grid">
      <div class="status-msg">⚡ Memuat data...</div>
    </div>
  </div>

  <div id="playerView" class="player-view">
    <button class="btn-back" onclick="showCatalog()">⬅️ Kembali ke Katalog</button>
    <h1 id="animeTitle" class="title-anime">Judul</h1>

    <div class="player-box">
      <div id="playerLoading" class="loading-text" style="display:none;">⏳ Memuat Stream Video...</div>
      <iframe id="videoIframe" src="about:blank" allowfullscreen referrerpolicy="no-referrer"></iframe>
    </div>

    <select id="selectEp" class="ep-select">
      <option value="">Pilih Episode...</option>
    </select>

    <div class="section-title">📺 Daftar Episode</div>
    <div id="epGrid" class="ep-grid"></div>
  </div>

</div>

<script>
  const API_KEY = "bb47332ceca91e3a2c97128a40c798a69306400072cc4b5a352800697069e45c";
  let currentCategory = "anime";
  let currentAnimePath = "";
  let currentDramaId = "";
  let currentDramaPath = "";

  // PENELUSURAN STREAM URL SECARA MENDALAM (DEEP SEARCH)
  function findStreamUrl(obj) {
    if (!obj) return '';
    if (typeof obj === 'string') {
      if (obj.startsWith('http://') || obj.startsWith('https://') || obj.startsWith('//')) {
        if (obj.includes('.m3u8') || obj.includes('.mp4') || obj.includes('stream') || obj.includes('embed') || obj.includes('play') || obj.includes('video')) {
          return obj.startsWith('//') ? 'https:' + obj : obj;
        }
      }
      return '';
    }
    if (typeof obj === 'object') {
      const priorityKeys = ['playUrl', 'url', 'mediaUrl', 'play_url', 'videoUrl', 'stream', 'hls', 'm3u8', 'link', 'embedUrl', 'embed_url', 'embed', 'play_path', 'path'];
      for (let k of priorityKeys) {
        if (obj[k] && typeof obj[k] === 'string' && (obj[k].startsWith('http') || obj[k].startsWith('//'))) {
          return obj[k].startsWith('//') ? 'https:' + obj[k] : obj[k];
        }
      }
      for (let key in obj) {
        if (obj.hasOwnProperty(key)) {
          let res = findStreamUrl(obj[key]);
          if (res) return res;
        }
      }
    }
    return '';
  }

  // EKSTRAKSI ITEM UNTUK KATALOG & SEARCH
  function extractItems(json) {
    if (!json) return [];
    let root = json.data || json;
    let listArr = [];

    if (Array.isArray(root)) listArr = root;
    else if (typeof root === 'object') {
      listArr = root.list || root.items || root.records || root.results || root.subjectList || root.subject_list || root.searchResultList || [];
    }

    let finalItems = [];

    listArr.forEach(item => {
      const subList = item.list || item.items || item.subjectList || item.subject_list || item.bannerList || item.cardList;
      if (Array.isArray(subList) && subList.length > 0) {
        subList.forEach(sub => finalItems.push(sub));
      } else {
        finalItems.push(item);
      }
    });

    return finalItems.filter(item => {
      const t = item.title || item.name || item.caption || item.subjectName || item.bookName || item.titleName || '';
      return t.trim().length > 0;
    });
  }

  // DETEKSI POSTER SEMUA VARIAN DENGAN FALLBACK PROTOKOL
  function getPoster(item) {
    if (!item) return '';
    let candidates = [
      item.cover, item.poster, item.coverUrl, item.verticalCover, item.img, item.thumb,
      item.coverPath, item.image, item.picture, item.posterPath, item.cover_path,
      item.vertical_cover, item.horizontal_cover, item.icon, item.avatar, item.thumbnail
    ];
    for (let c of candidates) {
      if (!c) continue;
      if (typeof c === 'string' && c.trim().length > 0) {
        let p = c.trim();
        if (p.startsWith('//')) return 'https:' + p;
        if (p.startsWith('http://') || p.startsWith('https://')) return p;
        if (p.startsWith('/')) return 'https://indocast.site' + p;
        return p;
      }
      if (typeof c === 'object' && c !== null) {
        let url = c.url || c.path || c.link || c.src || '';
        if (typeof url === 'string' && url.trim().length > 0) {
          let p = url.trim();
          if (p.startsWith('//')) return 'https:' + p;
          if (p.startsWith('http://') || p.startsWith('https://')) return p;
          return p;
        }
      }
    }
    return '';
  }

  function switchCategory(cat) {
    currentCategory = cat;
    document.getElementById('btnMainAnime').classList.toggle('active', cat === 'anime');
    document.getElementById('btnMainDrama').classList.toggle('active', cat === 'drama');
    document.getElementById('subNavAnime').style.display = cat === 'anime' ? 'inline-flex' : 'none';
    document.getElementById('subNavDrama').style.display = cat === 'drama' ? 'inline-flex' : 'none';

    if (cat === 'anime') {
      document.getElementById('sectionTitle').innerText = '🔥 ANIME TERBARU';
      loadAnime('home');
    } else {
      document.getElementById('sectionTitle').innerText = '🔥 DRAMA TERBARU';
      loadDrama('home');
    }
  }

  // FETCH MULTI-PROXY (VERCEL -> CORSPROXY -> ALLORIGINS)
  async function fetchWithFallback(backendUrl, targetDirectUrl) {
    try {
      const res = await fetch(backendUrl);
      if (res.ok) {
        const json = await res.json();
        const items = extractItems(json);
        if (items && items.length > 0) return items;
      }
    } catch (e) {}

    try {
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetDirectUrl)}`;
      const res = await fetch(proxyUrl, { headers: { "Content-Type": "application/json", "x-api-key": API_KEY } });
      const json = await res.json();
      const items = extractItems(json);
      if (items && items.length > 0) return items;
    } catch (e) {}

    try {
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetDirectUrl)}`;
      const res = await fetch(proxyUrl);
      const json = await res.json();
      return extractItems(json);
    } catch (e) {
      return [];
    }
  }

  async function fetchWithFallbackSingle(backendUrl, targetDirectUrl) {
    try {
      const res = await fetch(backendUrl);
      if (res.ok) {
        const json = await res.json();
        if (json && (json.data || json.success !== false)) return json;
      }
    } catch (e) {}

    try {
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetDirectUrl)}`;
      const res = await fetch(proxyUrl, { headers: { "Content-Type": "application/json", "x-api-key": API_KEY } });
      return await res.json();
    } catch (e) {
      return null;
    }
  }

  // --- ANIME HANDLERS ---
  async function loadAnime(act, btnElem) {
    if (btnElem) setActiveSub('subNavAnime', btnElem);
    showCatalog();
    document.getElementById('subArea').innerHTML = '';
    const grid = document.getElementById('catalogGrid');
    grid.style.display = 'grid';
    grid.innerHTML = '<div class="status-msg">⚡ Memuat data AnimeKompi...</div>';

    if (act === 'genres') {
      document.getElementById('sectionTitle').innerText = '🏷️ GENRE ANIME';
      const items = await fetchWithFallback(`/api/anime?action=genres`, `https://indocast.site/api/animekompi/genres`);
      grid.style.display = 'none';
      let html = '<div class="pills-grid">';
      items.forEach(g => {
        const name = g.name || g.title || g;
        html += `<button class="pill-btn" onclick="loadAnimeGenre('${name}')">${name}</button>`;
      });
      html += '</div>';
      document.getElementById('subArea').innerHTML = html;
      return;
    }

    let directUrl = `https://indocast.site/api/animekompi/home?page=1`;
    if (act === 'list') directUrl = `https://indocast.site/api/animekompi/list`;
    if (act === 'schedule') directUrl = `https://indocast.site/api/animekompi/schedule`;

    const items = await fetchWithFallback(`/api/anime?action=${act}`, directUrl);
    renderGrid(items, 'anime');
  }

  async function loadAnimeGenre(genreName) {
    document.getElementById('sectionTitle').innerText = `🏷️ GENRE: ${genreName.toUpperCase()}`;
    document.getElementById('subArea').innerHTML = '';
    const grid = document.getElementById('catalogGrid');
    grid.style.display = 'grid';
    grid.innerHTML = '<div class="status-msg">⚡ Memuat genre...</div>';

    const items = await fetchWithFallback(
      `/api/anime?action=genredetail&genre=${encodeURIComponent(genreName)}`, 
      `https://indocast.site/api/animekompi/genre-detail?genre=${encodeURIComponent(genreName)}&page=1`
    );
    renderGrid(items, 'anime');
  }

  // --- DRAMA HANDLERS ---
  async function loadDrama(act, btnElem) {
    if (btnElem) setActiveSub('subNavDrama', btnElem);
    showCatalog();
    document.getElementById('subArea').innerHTML = '';
    const grid = document.getElementById('catalogGrid');
    grid.style.display = 'grid';
    grid.innerHTML = '<div class="status-msg">⚡ Memuat data Filmbox...</div>';

    if (act === 'trending') document.getElementById('sectionTitle').innerText = '🔥 DRAMA TRENDING';
    else document.getElementById('sectionTitle').innerText = '🔥 DRAMA TERBARU';

    let directUrl = `https://indocast.site/api/filmbox/home`;
    if (act === 'trending') directUrl = `https://indocast.site/api/filmbox/trending?page=0&perPage=18`;

    const items = await fetchWithFallback(`/api/drama?action=${act}`, directUrl);
    renderGrid(items, 'drama');
  }

  // RENDER GRID KATALOG
  function renderGrid(items, mode) {
    const grid = document.getElementById('catalogGrid');
    grid.style.display = 'grid';
    if (!items || items.length === 0) {
      grid.innerHTML = '<div class="status-msg">Data tidak ditemukan.<br><button class="btn-retry" onclick="location.reload()">🔄 Muat Ulang</button></div>';
      return;
    }

    grid.innerHTML = '';
    items.forEach(item => {
      const title = item.title || item.name || item.caption || item.subjectName || item.bookName || 'Tanpa Judul';
      const poster = getPoster(item);
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <div class="poster-box">
          <img src="${poster}" alt="${title}" loading="lazy" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/300x400/21262d/00a8e8?text=No+Cover';" />
        </div>
        <div class="card-title">${title}</div>
      `;

      if (mode === 'anime') {
        const path = item.path || item.slug || item.id || '';
        card.onclick = () => openAnimeDetail(path, title);
      } else {
        const detailPath = item.detailPath || item.domainPath || item.path || item.slug || item.detail_path || '';
        const id = item.id || item.subjectId || item.subject_id || item.idStr || '';
        card.onclick = () => openDramaDetail(detailPath, id, title);
      }

      grid.appendChild(card);
    });
  }

  // DETAIL ANIME
  async function openAnimeDetail(path, title) {
    currentAnimePath = path;
    document.getElementById('catalogView').style.display = 'none';
    document.getElementById('playerView').classList.add('active');
    document.getElementById('animeTitle').innerText = title;

    const epSelect = document.getElementById('selectEp');
    const epGrid = document.getElementById('epGrid');
    epGrid.innerHTML = 'Memuat episode...';
    epSelect.innerHTML = '<option value="">Pilih Episode...</option>';

    let directUrl = `https://indocast.site/api/animekompi/detail?path=${encodeURIComponent(path)}`;
    let data = await fetchWithFallbackSingle(`/api/anime?action=detail&path=${encodeURIComponent(path)}`, directUrl);
    let epList = [];
    if (data) {
      let d = data.data || data;
      epList = d.episode_list || d.episodes || [];
    }

    epGrid.innerHTML = '';
    if (epList && epList.length > 0) {
      epList.forEach((ep, i) => {
        const epId = ep.episode_id || ep.id || ep.path;
        const epTitle = ep.title || `Eps ${i + 1}`;

        const opt = document.createElement('option');
        opt.value = epId; opt.textContent = epTitle;
        epSelect.appendChild(opt);

        const btn = document.createElement('button');
        btn.className = 'ep-btn';
        btn.innerText = `Eps ${i + 1}`;
        btn.onclick = () => playAnimeEp(epId);
        epGrid.appendChild(btn);
      });
      playAnimeEp(epList[0].episode_id || epList[0].id || epList[0].path);
    }
  }

  async function playAnimeEp(epId) {
    const loader = document.getElementById('playerLoading');
    const iframe = document.getElementById('videoIframe');
    loader.style.display = 'flex';
    iframe.src = 'about:blank';

    let directUrl = `https://indocast.site/api/animekompi/play?episode_id=${encodeURIComponent(epId)}`;
    let json = await fetchWithFallbackSingle(`/api/anime?action=play&episode_id=${encodeURIComponent(epId)}`, directUrl);
    let streamUrl = findStreamUrl(json);

    if (streamUrl) iframe.src = streamUrl;
    else alert('Link video stream tidak ditemukan.');
    loader.style.display = 'none';
  }

  // DETAIL DRAMA (FIX 0-INDEX EPISODE & PLAYBACK)
  async function openDramaDetail(detailPath, id, title) {
    currentDramaPath = detailPath;
    currentDramaId = id;
    document.getElementById('catalogView').style.display = 'none';
    document.getElementById('playerView').classList.add('active');
    document.getElementById('animeTitle').innerText = title;

    const epGrid = document.getElementById('epGrid');
    const epSelect = document.getElementById('selectEp');
    epGrid.innerHTML = 'Memuat episode...';
    epSelect.innerHTML = '<option value="">Pilih Episode...</option>';

    let directUrl = `https://indocast.site/api/filmbox/details?detailPath=${encodeURIComponent(detailPath)}&id=${id}`;
    let data = await fetchWithFallbackSingle(`/api/drama?action=details&detailPath=${encodeURIComponent(detailPath)}&id=${id}`, directUrl);
    
    let epList = [];
    if (data) {
      let d = data.data || data;
      epList = d.episodes || d.chapterList || d.resourceList || d.itemList || d.seasons || [];
    }

    epGrid.innerHTML = '';
    if (Array.isArray(epList) && epList.length > 0) {
      epList.forEach((ep, i) => {
        const opt = document.createElement('option');
        opt.value = i; opt.textContent = `Eps ${i + 1}`;
        epSelect.appendChild(opt);

        const btn = document.createElement('button');
        btn.className = 'ep-btn';
        btn.innerText = `Eps ${i + 1}`;
        btn.onclick = () => playDramaEp(i);
        epGrid.appendChild(btn);
      });
      playDramaEp(0);
    } else {
      const btn = document.createElement('button');
      btn.className = 'ep-btn active';
      btn.innerText = 'Eps 1';
      btn.onclick = () => playDramaEp(0);
      epGrid.appendChild(btn);
      playDramaEp(0);
    }
  }

  async function playDramaEp(epNum) {
    const loader = document.getElementById('playerLoading');
    const iframe = document.getElementById('videoIframe');
    loader.style.display = 'flex';
    iframe.src = 'about:blank';

    let backendUrl = `/api/drama?action=getplay&subjectId=${currentDramaId}&detailPath=${encodeURIComponent(currentDramaPath)}&se=0&ep=${epNum}`;
    let directUrl = `https://indocast.site/api/filmbox/getplay?subjectId=${currentDramaId}&detailPath=${encodeURIComponent(currentDramaPath)}&se=0&ep=${epNum}&lang=in_id`;

    let json = await fetchWithFallbackSingle(backendUrl, directUrl);
    let streamUrl = findStreamUrl(json);

    // Fallback jika index 0 mencoba index 1
    if (!streamUrl && epNum === 0) {
      let fbBackend = `/api/drama?action=getplay&subjectId=${currentDramaId}&detailPath=${encodeURIComponent(currentDramaPath)}&se=0&ep=1`;
      let fbDirect = `https://indocast.site/api/filmbox/getplay?subjectId=${currentDramaId}&detailPath=${encodeURIComponent(currentDramaPath)}&se=0&ep=1&lang=in_id`;
      let json2 = await fetchWithFallbackSingle(fbBackend, fbDirect);
      streamUrl = findStreamUrl(json2);
    }

    if (streamUrl) iframe.src = streamUrl;
    else alert('Link video stream tidak ditemukan untuk episode ini.');
    loader.style.display = 'none';
  }

  // SEARCH FUNCTION
  document.getElementById('searchInput').addEventListener('keypress', async (e) => {
    if (e.key === 'Enter') {
      const q = e.target.value.trim();
      if (!q) return;
      showCatalog();
      const grid = document.getElementById('catalogGrid');
      grid.style.display = 'grid';
      grid.innerHTML = '<div class="status-msg">🔍 Mencari...</div>';

      if (currentCategory === 'drama') {
        document.getElementById('sectionTitle').innerText = `🔍 HASIL PENCARIAN: ${q.toUpperCase()}`;
        const res = await fetch(`/api/drama?action=search&keyword=${encodeURIComponent(q)}`);
        const json = await res.json();
        renderGrid(extractItems(json), 'drama');
      } else {
        document.getElementById('sectionTitle').innerText = `🔍 HASIL PENCARIAN: ${q.toUpperCase()}`;
        const res = await fetch(`/api/anime?action=home&page=1`);
        const json = await res.json();
        const items = extractItems(json).filter(i => (i.title || i.name || '').toLowerCase().includes(q.toLowerCase()));
        renderGrid(items, 'anime');
      }
    }
  });

  function setActiveSub(navId, btn) {
    document.querySelectorAll(`#${navId} .sub-btn`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function showCatalog() {
    document.getElementById('catalogView').style.display = 'block';
    document.getElementById('playerView').classList.remove('active');
    document.getElementById('videoIframe').src = 'about:blank';
  }

  // START DEFAULT
  switchCategory('anime');
</script>
</body>
</html>
