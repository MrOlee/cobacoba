<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAYLIZIIEDESU - Portal Streaming</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <header>
    <div class="logo">RAYLIZIIE<span>DESU</span></div>
    <div class="subtitle">Anime & Drama Subtitle Indonesia</div>
  </header>

  <nav class="main-nav">
    <button class="active" data-category="anime">🎌 Anime</button>
    <button data-category="drama">🎬 Drama</button>
  </nav>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Cari judul anime atau drama...">
  </div>

  <div class="sub-nav" id="subNav"></div>

  <main id="app">
    <div id="catalog"></div>
    <div id="player" style="display:none;">
      <button id="backBtn">← Kembali</button>
      <h2 id="playerTitle"></h2>
      <div class="video-wrapper">
        <iframe id="playerIframe" src="about:blank" allowfullscreen></iframe>
      </div>
      <div id="episodeList"></div>
    </div>
  </main>

  <script src="/scripts/api.js"></script>
  <script src="/scripts/components.js"></script>
  <script src="/scripts/app.js"></script>
</body>
</html>
