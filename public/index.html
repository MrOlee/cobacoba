<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#121212" />
<meta name="referrer" content="no-referrer" />
<title>RAYLIZIIEDESU — Anime Subtitle Indonesia</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: #121212; color: #ffffff; min-height: 100vh; padding-bottom: 40px; }
  a { color: inherit; text-decoration: none; }
  button { cursor: pointer; border: none; font-family: inherit; }

  /* HEADER LOGO OTAKUDESU STYLE */
  header { background-color: #000000; padding: 20px 15px; text-align: center; border-bottom: 2px solid #00a8e8; }
  .logo { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; text-transform: uppercase; }
  .logo .white { color: #ffffff; }
  .logo .blue { color: #00a8e8; }
  .sub-logo { font-size: 12px; color: #00a8e8; margin-top: 4px; font-weight: 600; }

  /* NAV BAR */
  .nav-bar { display: flex; background: #1e1e1e; max-width: 900px; margin: 0 auto; border-bottom: 1px solid #333; }
  .nav-btn { flex: 1; padding: 12px 5px; text-align: center; background: #1e1e1e; color: #bbb; font-weight: 700; font-size: 14px; text-transform: uppercase; border: none; transition: 0.2s; }
  .nav-btn.active, .nav-btn:hover { background: #00a8e8; color: #fff; }

  /* SEARCH BAR */
  .search-wrap { max-width: 900px; margin: 10px auto; padding: 0 10px; }
  .search-input { width: 100%; padding: 11px 14px; background: #ffffff; color: #000; border: none; border-radius: 4px; font-size: 14px; outline: none; font-weight: 500; }

  /* CONTAINER UTAMA */
  .container { max-width: 900px; margin: 0 auto; padding: 10px; }
  
  /* GRID KATALOG */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 12px; } }

  .card { background: #1c1c1c; border: 1px solid #2d2d2d; border-radius: 6px; overflow: hidden; cursor: pointer; transition: transform 0.2s; position: relative; }
  .card:hover { transform: translateY(-3px); border-color: #00a8e8; }
  .card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background: #222; }
  .card-title { padding: 10px; font-size: 13px; font-weight: 700; line-height: 1.3; color: #eee; height: 48px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  /* PLAYER VIEW */
  .player-view { display: none; }
  .player-view.active { display: block; }
  
  .btn-back { background: #2a2a2a; color: #fff; padding: 8px 14px; border-radius: 4px; font-size: 13px; font-weight: 700; margin-bottom: 12px; display: inline-block; }
  .btn-back:hover { background: #00a8e8; }

  .title-anime { font-size: 18px; font-weight: 800; color: #00a8e8; margin-bottom: 12px; line-height: 1.3; }

  .player-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border: 1px solid #333; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
  .player-box iframe { width: 100%; height: 100%; border: none; }
  .loading-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; color: #00a8e8; font-weight: 700; font-size: 14px; }

  .ep-select { width: 100%; padding: 10px; background: #1c1c1c; border: 1px solid #00a8e8; color: #fff; border-radius: 4px; font-size: 13px; outline: none; margin-bottom: 12px; }

  .ep-grid-title { font-size: 14px; font-weight: 700; margin: 15px 0 10px; color: #00a8e8; }
  .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
  .ep-btn { background: #1c1c1c; border: 1px solid #333; color: #fff; padding: 8px 4px; font-size: 12px; font-weight: 700; text-align: center; border-radius: 4px; }
  .ep-btn.active, .ep-btn:hover { background: #00a8e8; border-color: #00a8e8; }

  .status-msg { text-align: center; padding: 40px 15px; color: #aaa; grid-column: 1 / -1; font-size: 14px; line-height: 1.5; }
  .status-msg.error { color: #f87171; background: #1a1010; border: 1px solid #4a1d1d; border-radius: 6px; }
  .btn-retry { margin-top: 12px; background: #00a8e8; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; font-weight: 700; font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="white">RAYLIZIIE</span><span class="blue">DESU</span>
  </div>
  <div class="sub-logo">Anime Subtitle Indonesia</div>
</header>

<div class="nav-bar">
  <button class="nav-btn active" id="btnTabAnime" onclick="switchChannel('2')">ANIME</button>
  <button class="nav-btn" id="btnTabDrama" onclick="switchChannel('1')">DRAMA</button>
</div>

<div class="search-wrap">
  <input type="text" id="searchInput" class="search-input" placeholder="Cari judul anime..." />
</div>

<div class="container">

  <!-- KATALOG VIEW -->
  <div id="catalogView">
    <div id="catalogGrid" class="grid">
      <div class="status-msg">⏳ Memuat data anime dari server Indocast...</div>
    </div>
  </div>

  <!-- PLAYER VIEW -->
  <div id="playerView" class="player-view">
    <button class="btn-back" onclick="showCatalog()">⬅️ Kembali ke Katalog</button>
    <h1 id="animeTitle" class="title-anime">Judul Anime</h1>

    <div class="player-box">
      <div id="playerLoading" class="loading-text" style="display:none;">⏳ Memuat Video Stream...</div>
      <iframe id="videoIframe" src="about:blank" allowfullscreen></iframe>
    </div>

    <select id="selectEp" class="ep-select">
      <option value="">Pilih Episode...</option>
    </select>

    <div class="ep-grid-title">Daftar Episode:</div>
    <div id="epGrid" class="ep-grid"></div>
  </div>

</div>

<script>
  let allCatalogData = [];
  let currentAnimeId = "";
  let currentAnimePath = "";

  function extractItems(resData) {
    if (!resData) return null;
    if (Array.isArray(resData)) return resData;
    if (Array.isArray(resData.data)) return resData.data;
    if (resData.data && typeof resData.data === 'object') {
      if (Array.isArray(resData.data.list)) return resData.data.list;
      if (Array.isArray(resData.data.items)) return resData.data.items;
      if (Array.isArray(resData.data.records)) return resData.data.records;
    }
    if (Array.isArray(resData.list)) return resData.list;
    if (Array.isArray(resData.items)) return resData.items;
    return null;
  }

  async function loadCatalog(channelId = "2") {
    showCatalog();
    const grid = document.getElementById('catalogGrid');
    grid.innerHTML = '<div class="status-msg">⏳ Memuat data dari server...</div>';

    try {
      // HANYA panggil server backend Vercel internal
      const res = await fetch(`/api/list?channelId=${channelId}&page=1`);
      const result = await res.json();

      const items = extractItems(result);

      if (!items || items.length === 0) {
        grid.innerHTML = `
          <div class="status-msg error">
            ⚠️ ${result.message || 'Gagal terhubung ke API Indocast.'}<br>
            <button class="btn-retry" onclick="loadCatalog('${channelId}')">🔄 Coba Lagi</button>
          </div>`;
        return;
      }

      allCatalogData = items;
      renderGrid(items);
    } catch (err) {
      grid.innerHTML = `
        <div class="status-msg error">
          ⚠️ Gagal Terhubung: ${err.message}<br>
          <button class="btn-retry" onclick="loadCatalog('${channelId}')">🔄 Coba Lagi</button>
        </div>`;
    }
  }

  function renderGrid(items) {
    const grid = document.getElementById('catalogGrid');
    if (!items || items.length === 0) {
      grid.innerHTML = '<div class="status-msg">Data anime tidak ditemukan.</div>';
      return;
    }

    grid.innerHTML = '';
    items.forEach(item => {
      const title = item.title || item.name || item.bookName || 'Tanpa Judul';
      let poster = item.cover || item.coverUrl || item.poster || item.img || 'https://via.placeholder.com/300x400?text=No+Cover';
      if (poster.startsWith('//')) poster = 'https:' + poster;

      const id = item.id || item.bookId || '';
      const path = item.detailPath || item.slug || '';

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${poster}" alt="${title}" loading="lazy" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/300x400?text=No+Cover'" />
        <div class="card-title">${title}</div>
      `;
      card.onclick = () => openDetail(id, path, title);
      grid.appendChild(card);
    });
  }

  async function openDetail(id, path, title) {
    currentAnimeId = id;
    currentAnimePath = path;

    document.getElementById('catalogView').style.display = 'none';
    document.getElementById('playerView').classList.add('active');
    document.getElementById('animeTitle').innerText = title;
    
    const epSelect = document.getElementById('selectEp');
    const epGrid = document.getElementById('epGrid');
    epSelect.innerHTML = '<option value="">Pilih Episode...</option>';
    epGrid.innerHTML = 'Memuat episode...';

    try {
      const res = await fetch(`/api/detail?detailPath=${encodeURIComponent(path)}`);
      const result = await res.json();
      const data = result?.data || result;

      const epList = data?.chapterList || data?.episodes || data?.items || [];
      epGrid.innerHTML = '';

      if (epList.length > 0) {
        epList.forEach((ep, i) => {
          const epNum = ep.episode || ep.ep || (i + 1);
          
          const opt = document.createElement('option');
          opt.value = epNum;
          opt.textContent = `Episode ${epNum}`;
          epSelect.appendChild(opt);

          const btn = document.createElement('button');
          btn.className = 'ep-btn';
          btn.innerText = `Eps ${epNum}`;
          btn.onclick = () => playEp(epNum);
          epGrid.appendChild(btn);
        });
        playEp(1);
      } else {
        playEp(1);
      }
    } catch (e) {
      playEp(1);
    }
  }

  async function playEp(epNum) {
    const loader = document.getElementById('playerLoading');
    const iframe = document.getElementById('videoIframe');
    loader.style.display = 'flex';
    iframe.src = 'about:blank';

    document.getElementById('selectEp').value = epNum;

    document.querySelectorAll('.ep-btn').forEach((btn, idx) => {
      if (idx + 1 == epNum) btn.classList.add('active');
      else btn.classList.remove('active');
    });

    try {
      const res = await fetch(`/api/play?id=${currentAnimeId}&ep=${epNum}&detailPath=${encodeURIComponent(currentAnimePath)}`);
      const result = await res.json();
      const data = result?.data || result;
      const videoUrl = data.playUrl || data.url || data.embed || data.embedUrl || '';

      if (videoUrl) {
        iframe.src = videoUrl;
      } else {
        alert('Link video stream tidak ditemukan untuk episode ini.');
      }
    } catch (e) {
      alert('Gagal memuat player video.');
    } finally {
      setTimeout(() => { loader.style.display = 'none'; }, 500);
    }
  }

  function showCatalog() {
    document.getElementById('catalogView').style.display = 'block';
    document.getElementById('playerView').classList.remove('active');
    document.getElementById('videoIframe').src = 'about:blank';
  }

  function switchChannel(ch) {
    document.getElementById('btnTabAnime').classList.toggle('active', ch === '2');
    document.getElementById('btnTabDrama').classList.toggle('active', ch === '1');
    loadCatalog(ch);
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    if (!q) { renderGrid(allCatalogData); return; }
    const filtered = allCatalogData.filter(item => {
      const t = (item.title || item.name || item.bookName || '').toLowerCase();
      return t.includes(q);
    });
    renderGrid(filtered);
  });

  document.getElementById('selectEp').addEventListener('change', (e) => {
    if (e.target.value) playEp(e.target.value);
  });

  // START
  loadCatalog("2");
</script>
</body>
</html>
